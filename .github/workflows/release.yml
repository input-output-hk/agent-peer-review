name: Release

# On-demand release from main. Run from the Actions tab and pick a semver bump
# (or type an explicit version). One run:
#   1. bumps the version across every workspace (scripts/version.ts),
#   2. finalizes the changelog (## Unreleased -> ## <version>),
#   3. commits the release to main and creates the GitHub release.
# The release then fires publish.yml, which ships both libraries.
#
# Requires a RELEASE_TOKEN secret: a token whose owner can push to main and
# create releases. The default GITHUB_TOKEN cannot be used, because a release it
# creates would not trigger publish.yml. See docs/releasing.md for setup.
on:
  workflow_dispatch:
    inputs:
      bump:
        description: "Semver bump (ignored when 'version' is set)"
        type: choice
        options: [patch, minor, major]
        default: patch
        required: true
      version:
        description: "Explicit version, e.g. 1.0.0 (optional; overrides bump)"
        type: string
        required: false

# Writes are done with RELEASE_TOKEN, not the job's GITHUB_TOKEN.
permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Require RELEASE_TOKEN
        env:
          RELEASE_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        run: |
          if [ -z "$RELEASE_TOKEN" ]; then
            echo "::error::RELEASE_TOKEN secret is not set. See docs/releasing.md."
            exit 1
          fi

      # No `token:` here, on purpose. The automatic GITHUB_TOKEN (contents: read)
      # is enough to clone, and `persist-credentials: false` keeps any credential
      # out of .git/config, so nothing that runs later in this job can read one.
      # RELEASE_TOKEN reaches only three steps, each through its own `env:`: the
      # pre-flight check above, the push, and the release creation. Install,
      # tests, and builds all run without it. See issue #69.
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }

      # No install scripts: this job commits whatever is in the tree and pushes
      # it to main, so no dependency gets to run code here. Verified sufficient
      # for every step below (the esbuild and rollup platform binaries are all in
      # the lockfile, so nothing needs downloading). The one thing this leaves
      # uncompiled is better-sqlite3, which only the dashboard *tests* need, and
      # this job does not run them; adding a step that does means revisiting this.
      - run: npm ci --ignore-scripts

      # 1. Bump every version spot and sync the lockfile.
      - name: Bump version
        id: bump
        env:
          BUMP: ${{ inputs.bump }}
          VERSION: ${{ inputs.version }}
        run: |
          arg="${VERSION:-$BUMP}"
          npm run version:set -- "$arg"
          npm install --package-lock-only
          v="$(node -p "require('./package.json').version")"
          echo "version=$v" >> "$GITHUB_OUTPUT"
          if node -e "process.exit(require('semver').prerelease(process.argv[1]) ? 0 : 1)" "$v"; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          fi
          echo "Releasing v$v"

      # 2. Fail fast on any drift, then gate on a green build and tests.
      #    Mirrors CI so an admin direct-push that skipped CI is still caught here.
      - run: npm run check:version
      # The bump above regenerated the lockfile, so this is the moment to confirm
      # every tarball it names is still pinned by hash.
      - run: npm run check:lockfile
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm run -w pi test
      - run: npm run -w pi build
      - run: npm run -w dashboard build

      # 3. Finalize the changelog and capture the release notes.
      - name: Finalize changelog
        env:
          VERSION: ${{ steps.bump.outputs.version }}
        run: npm run changelog:release -- "$VERSION" --notes-out "$RUNNER_TEMP/notes.md"

      # 4. Commit the release to main (RELEASE_TOKEN owner must be able to push).
      #    The checkout persisted no credential, so the push carries the token in
      #    an explicit remote URL taken from this step's `env:`. It is never
      #    written to .git/config, and every step above ran without it.
      - name: Commit and push
        id: commit
        env:
          RELEASE_TOKEN: ${{ secrets.RELEASE_TOKEN }}
          VERSION: ${{ steps.bump.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -s -m "chore(release): $VERSION"
          git push "https://x-access-token:$RELEASE_TOKEN@github.com/$GITHUB_REPOSITORY.git" HEAD:main
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      # 5. Create the release at the exact commit just pushed, not "main" (which
      #    another merge could have moved past it). A RELEASE_TOKEN-authored
      #    release triggers publish.yml. Retried and idempotent; if it still
      #    fails, main is already bumped, so follow the recovery note in
      #    docs/releasing.md.
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
          VERSION: ${{ steps.bump.outputs.version }}
          SHA: ${{ steps.commit.outputs.sha }}
          PRERELEASE: ${{ steps.bump.outputs.prerelease }}
        run: |
          pre=""
          if [ "$PRERELEASE" = "true" ]; then pre="--prerelease"; fi
          for attempt in 1 2 3; do
            if gh release view "v$VERSION" >/dev/null 2>&1; then
              echo "Release v$VERSION already exists."
              exit 0
            fi
            if gh release create "v$VERSION" --target "$SHA" --title "v$VERSION" --notes-file "$RUNNER_TEMP/notes.md" $pre; then
              exit 0
            fi
            echo "release create attempt $attempt failed; retrying in 5s..."
            sleep 5
          done
          echo "::error::could not create release v$VERSION after 3 attempts; main is bumped. See the recovery note in docs/releasing.md."
          exit 1
