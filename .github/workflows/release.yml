name: Release

# On-demand release from main. Run from the Actions tab and pick a semver bump
# (or type an explicit version). One run:
#   1. validates the exact main commit in a job with no write credential,
#   2. bumps the version and finalizes the changelog in a fresh dependency-free job,
#   3. commits the release to main and creates the GitHub release.
# The release then fires publish.yml, which ships both libraries.
#
# Requires a RELEASE_TOKEN secret on the protected `release` environment: a token whose owner can
# push to main and create releases. It must not be a repository-level secret, which a modified
# workflow on another in-repository branch could request. See docs/releasing.md for setup.
on:
  workflow_dispatch:
    inputs:
      bump:
        description: "Semver bump (ignored when 'version' is set)"
        type: choice
        options: [patch, minor, major]
        default: patch
        required: true
      version:
        description: "Explicit version, e.g. 1.0.0 (optional; overrides bump)"
        type: string
        required: false

# Writes are done with RELEASE_TOKEN, not the job's GITHUB_TOKEN.
permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  # Resolve main before any repository dependency runs. Both later jobs consume this output, so a
  # dependency in validate cannot redirect the privileged checkout to another commit.
  resolve:
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.ref.outputs.sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: main
          persist-credentials: false
      - id: ref
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  # Full CI-equivalent validation. This job installs and executes repository dependencies, so it
  # deliberately has no release or package credential and shares no runner with either write.
  validate:
    needs: resolve
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ needs.resolve.outputs.sha }}
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with: { node-version: 22, cache: npm }

      - run: npm ci

      # Exercise the ordinary maintainer tooling, including npm's lockfile update. The clean release
      # job repeats the deterministic write with scripts/write-release.mjs and no node_modules.
      - name: Prepare release candidate
        id: candidate
        env:
          BUMP: ${{ inputs.bump }}
          VERSION: ${{ inputs.version }}
        run: |
          arg="${VERSION:-$BUMP}"
          npm run version:set -- "$arg"
          npm install --package-lock-only
          v="$(node -p "require('./package.json').version")"
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "Releasing v$v"

      # Every invariant and every project CI lane, on the exact commit resolve captured.
      - run: npm run check:version
      - run: npm run check:schemas
      - run: npm run check:lockfile
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm run -w pi typecheck
      - run: npm run -w pi test
      - run: npm run -w pi build
      - run: npm run -w dashboard typecheck
      - run: npm run -w dashboard test
      - run: npm run -w dashboard build
      - name: Build docs site
        working-directory: docs
        run: npm ci && npm run build

      - name: Finalize changelog
        env:
          VERSION: ${{ steps.candidate.outputs.version }}
        run: npm run changelog:release -- "$VERSION" --notes-out "$RUNNER_TEMP/notes.md"

  # Credentialed work happens in a fresh runner. No npm install, build, test, or package lifecycle
  # runs here; the only repository program executed is the audited, Node-built-in-only release
  # writer. A compromised transitive dependency in validate therefore has no persistence path to
  # RELEASE_TOKEN (a hook, GITHUB_ENV/GITHUB_PATH edit, replaced executable, and so on).
  release:
    needs: [resolve, validate]
    runs-on: ubuntu-latest
    # The environment's deployment rules admit main (and v* for publish.yml), require a human
    # reviewer, and are the only place RELEASE_TOKEN exists. A workflow dispatched from a modified
    # branch therefore cannot reach the secret even if that branch removes every check above.
    environment: release
    steps:
      # Referencing a missing environment makes GitHub auto-create an unprotected one. Require a
      # variable that exists only on the deliberately configured environment, so that state fails
      # closed before the release writer or secret-bearing step runs.
      - name: Confirm protected release environment
        env:
          RELEASE_ENVIRONMENT_CONFIGURED: ${{ vars.RELEASE_ENVIRONMENT_CONFIGURED }}
        run: |
          if [ "$RELEASE_ENVIRONMENT_CONFIGURED" != "true" ]; then
            echo "::error::the release environment is not configured; see docs/releasing.md"
            exit 1
          fi

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ needs.resolve.outputs.sha }}
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with: { node-version: 22 }

      - name: Write release files without dependencies
        id: release
        env:
          BUMP: ${{ inputs.bump }}
          VERSION: ${{ inputs.version }}
        run: |
          arg="${VERSION:-$BUMP}"
          node scripts/write-release.mjs "$arg" "$RUNNER_TEMP/notes.md"

      - name: Verify release diff boundary
        run: |
          expected="$(printf '%s\n' CHANGELOG.md cli/index.ts dashboard/package.json mcp/server.ts package-lock.json package.json pi/package.json)"
          actual="$(git diff --name-only | sort)"
          if [ "$actual" != "$expected" ]; then
            echo "::error::release writer changed an unexpected file"
            diff -u <(printf '%s\n' "$expected") <(printf '%s\n' "$actual") || true
            exit 1
          fi

      - name: Commit and push
        id: commit
        env:
          RELEASE_TOKEN: ${{ secrets.RELEASE_TOKEN }}
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          if [ -z "$RELEASE_TOKEN" ]; then
            echo "::error::RELEASE_TOKEN secret is not set. See docs/releasing.md."
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CHANGELOG.md cli/index.ts dashboard/package.json mcp/server.ts package-lock.json package.json pi/package.json
          git commit -s -m "chore(release): $VERSION"
          git push "https://x-access-token:$RELEASE_TOKEN@github.com/$GITHUB_REPOSITORY.git" HEAD:main
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      # Create the release at the exact commit just pushed, not "main" (which
      #    another merge could have moved past it). A RELEASE_TOKEN-authored
      #    release triggers publish.yml. Retried and idempotent; if it still
      #    fails, main is already bumped, so follow the recovery note in
      #    docs/releasing.md.
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
          VERSION: ${{ steps.release.outputs.version }}
          SHA: ${{ steps.commit.outputs.sha }}
          PRERELEASE: ${{ steps.release.outputs.prerelease }}
        run: |
          pre=""
          if [ "$PRERELEASE" = "true" ]; then pre="--prerelease"; fi
          for attempt in 1 2 3; do
            if gh release view "v$VERSION" >/dev/null 2>&1; then
              echo "Release v$VERSION already exists."
              exit 0
            fi
            if gh release create "v$VERSION" --target "$SHA" --title "v$VERSION" --notes-file "$RUNNER_TEMP/notes.md" $pre; then
              exit 0
            fi
            echo "release create attempt $attempt failed; retrying in 5s..."
            sleep 5
          done
          echo "::error::could not create release v$VERSION after 3 attempts; main is bumped. See the recovery note in docs/releasing.md."
          exit 1
